spring:
  jpa:
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        use_sql_comments: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
  datasource:
    learning-management-service:
      writer:
        driver-class-name: org.postgresql.Driver
        jdbc-url: jdbc:postgresql://localhost:15432/lms
        username: lms
        password: lms
      reader:
        driver-class-name: org.postgresql.Driver
        jdbc-url: jdbc:postgresql://localhost:15432/lms
        username: lms
        password: lms
logging:
  level:
    org:
      hibernate:
        type:
          descriptor:
            sql: trace

query-counter:
  logging:
    level:
      error:
        count: 3
        enable: false
      warn:
        count: 2
        enable: true
      info:
        count: 1
        enable: true
